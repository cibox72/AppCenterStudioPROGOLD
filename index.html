<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AppCenterStudioPROGOLD - Accesso Suite Premium</title>
    <style>
        :root {
            --primary: #8e44ad;
            --primary-dark: #6c3483;
            --primary-light: #f4ecf7;
            --primary-gradient: linear-gradient(135deg, #a569bd 0%, #8e44ad 50%, #6c3483 100%);
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #f4ecf7 40%, #ebf5fb 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #e8e8e8;
            --success: #27ae60;
            --danger: #e74c3c;
            --lead-accent: #f39c12;
            --shadow: 0 12px 40px rgba(142, 68, 173, 0.15);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-header img {
            max-width: 140px;
            height: auto;
            margin-bottom: 16px;
            border-radius: 12px;
        }

        .brand-header h1 {
            font-size: 22px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .brand-header p {
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 36px 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            width: 100%;
            backdrop-filter: blur(20px);
        }

        .login-card h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 24px;
        }

        .role-selector {
            display: flex;
            background: #f0f0f0;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .role-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            background: white;
            transition: all 0.2s ease;
            width: 100%;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(142, 68, 173, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary-gradient);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(142, 68, 173, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .status-msg.success { display: block; background: #eafaf1; color: var(--success); border: 1px solid var(--success); }
        .status-msg.error { display: block; background: #fdedec; color: var(--danger); border: 1px solid var(--danger); }

        .lead-link-container {
            margin-top: 24px;
            text-align: center;
        }

        .lead-link {
            color: var(--lead-accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
            cursor: pointer;
        }

        .lead-link:hover {
            color: #d68910;
            text-decoration: underline;
        }

        .lead-form-card {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            border: 2px solid var(--lead-accent);
            width: 100%;
            margin-top: 20px;
        }

        .lead-form-card.active { display: block; }
        .lead-form-card h3 { color: var(--text-main); margin-bottom: 16px; text-align: center; font-size: 18px; }
        .btn-lead { background: var(--lead-accent); color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }

        .footer-branding {
            margin-top: 40px;
            text-align: center;
            color: var(--text-light);
            font-size: 12px;
            font-weight: 500;
        }
        .footer-branding strong { color: var(--primary); }

        .loading {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .login-card { padding: 24px 20px; }
            .role-btn { font-size: 12px; padding: 8px 0; }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <div class="brand-header">
            <img src="logo.jpg" alt="AppCenterStudioPROGOLD">
            <h1>AppCenterStudioPROGOLD</h1>
            <p>Suite Premium per Studi Fotografici</p>
        </div>

        <div class="login-card">
            <h2>Accedi alla tua Area</h2>
            
            <div class="role-selector">
                <button class="role-btn active" onclick="selezionaRuolo('cliente', this)">Cliente</button>
                <button class="role-btn" onclick="selezionaRuolo('studio', this)">Studio</button>
                <button class="role-btn" onclick="selezionaRuolo('admin', this)">Fornitore</button>
            </div>

            <div class="form-group">
                <label id="label-id">ID Evento / Cliente</label>
                <input type="text" id="user-id" placeholder="Inserisci il tuo ID univoco">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="user-pwd" placeholder="Inserisci la tua password">
            </div>

            <button class="btn-login" id="btn-login" onclick="effettuaLogin()">ACCEDI</button>
            
            <div class="status-msg" id="status-msg"></div>
        </div>

        <div class="lead-link-container" id="leadLinkContainer">
            <span class="lead-link" onclick="mostraFormLead()">Sei uno Studio Fotografico? Richiedi una Demo Gratuita</span>
        </div>

        <div class="lead-form-card" id="leadFormCard">
            <h3>Richiedi Demo Gratuita</h3>
            <div class="form-group">
                <label>Nome Studio</label>
                <input type="text" id="lead-nome" placeholder="es. Studio Rossi">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="lead-email" placeholder="studio@esempio.com">
            </div>
            <div class="form-group">
                <label>Telefono</label>
                <input type="tel" id="lead-tel" placeholder="+39 333...">
            </div>
            <button class="btn-lead" onclick="inviaLead()">INVIA RICHIESTA</button>
            <button class="btn-login" style="background: #e0e0e0; color: #333; margin-top: 10px;" onclick="nascondiFormLead()">Annulla</button>
            <div class="status-msg" id="status-lead"></div>
        </div>

        <div class="footer-branding">
            Piattaforma sviluppata e gestita da <strong>AppCenterStudioPROGOLD</strong>
        </div>

    </div>

    <script>
        const WORKER_URL = "https://appcenter-backend.mairaluigi-b2f.workers.dev";
        let ruoloAttuale = 'cliente';

        function selezionaRuolo(ruolo, btn) {
            ruoloAttuale = ruolo;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const labelId = document.getElementById('label-id');
            const inputId = document.getElementById('user-id');
            
            if (ruolo === 'cliente') {
                labelId.textContent = 'ID Evento / Cliente';
                inputId.placeholder = 'es. matrimonio-rossi-2026';
            } else if (ruolo === 'studio') {
                labelId.textContent = 'ID Studio';
                inputId.placeholder = 'es. studio-gold';
            } else {
                labelId.textContent = 'Password Suprema';
                inputId.placeholder = 'Inserisci password amministratore';
                inputId.type = 'password';
                return;
            }
            inputId.type = 'text';
        }

        function mostraStato(idElemento, messaggio, tipo) {
            const el = document.getElementById(idElemento);
            el.textContent = messaggio;
            el.className = 'status-msg ' + tipo;
            setTimeout(() => { el.className = 'status-msg'; }, 5000);
        }

        async function effettuaLogin() {
            const id = document.getElementById('user-id').value.trim();
            const pwd = document.getElementById('user-pwd').value.trim();
            const btn = document.getElementById('btn-login');

            if (!id || !pwd) {
                mostraStato('status-msg', 'Compila ID e Password', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Verifica in corso...';

            try {
                let endpoint = '';
                let body = {};

                if (ruoloAttuale === 'admin') {
                    endpoint = '/api/admin/login';
                    body = { password: pwd };
                } else if (ruoloAttuale === 'studio') {
                    endpoint = '/api/studio/login';
                    body = { studioId: id, password: pwd };
                } else {
                    endpoint = '/api/cliente/login';
                    body = { clienteId: id, password: pwd };
                }

                const response = await fetch(WORKER_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();

                if (data.success) {
                    mostraStato('status-msg', 'Accesso riuscito. Reindirizzamento...', 'success');
                    setTimeout(() => {
                        if (ruoloAttuale === 'admin') window.location.href = 'admin.html';
                        else if (ruoloAttuale === 'studio') {
                            localStorage.setItem('studioId', data.studioId || id);
                            window.location.href = 'plancia-studio.html';
                        }
                        else window.location.href = 'gallery.html?clienteId=' + encodeURIComponent(id);
                    }, 1000);
                } else {
                    mostraStato('status-msg', data.error || 'Credenziali non valide', 'error');
                }
            } catch (e) {
                mostraStato('status-msg', 'Errore di connessione al server', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'ACCEDI';
            }
        }

        function mostraFormLead() {
            document.getElementById('leadLinkContainer').style.display = 'none';
            document.getElementById('leadFormCard').classList.add('active');
        }

        function nascondiFormLead() {
            document.getElementById('leadLinkContainer').style.display = 'block';
            document.getElementById('leadFormCard').classList.remove('active');
        }

        async function inviaLead() {
            const nome = document.getElementById('lead-nome').value.trim();
            const email = document.getElementById('lead-email').value.trim();
            const tel = document.getElementById('lead-tel').value.trim();

            if (!nome || !email || !tel) {
                mostraStato('status-lead', 'Compila i campi obbligatori', 'error');
                return;
            }

            const leadData = {
                tipo: 'nuova_richiesta_demo',
                nomeStudio: nome, email, telefono: tel,
                dataRichiesta: new Date().toISOString(),
                stato: 'da_contattare'
            };

            const leads = JSON.parse(localStorage.getItem('leads_crm') || '[]');
            leads.push(leadData);
            localStorage.setItem('leads_crm', JSON.stringify(leads));

            fetch(WORKER_URL + '/api/admin/lead', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(leadData)
            }).catch(() => {});

            mostraStato('status-lead', 'Richiesta inviata! Ti contatteremo presto.', 'success');
            setTimeout(nascondiFormLead, 3000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('user-pwd').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') effettuaLogin();
            });
        });
    </script>
</body>
</html>
