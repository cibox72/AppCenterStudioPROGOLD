<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenter Studio Premium Gold</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c4c 0%, #2a4a5e 30%, #3d5a6c 70%, #2c3e50 100%),
                        repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(255, 255, 255, 0.02) 30px, rgba(255, 255, 255, 0.02) 60px);
            background-size: cover, 100px 100px;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: #ecf0f1;
            overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%),
                        linear-gradient(-45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%);
            pointer-events: none; z-index: 0;
        }
        .container {
            max-width: 1200px; margin: 0 auto; background: rgba(44, 62, 80, 0.95);
            border-radius: 15px; padding: 30px; box-shadow: 0 4px 30px rgba(0,0,0,0.3), 0 0 60px rgba(0,0,0,0.4);
            position: relative; z-index: 1; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        header h1 { color: #ffd700; font-size: 2.3em; font-weight: 300; letter-spacing: 2px; }
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        button {
            background: rgba(52, 73, 94, 0.8); color: #ecf0f1; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all 0.3s; font-weight: bold;
        }
        button:hover { background: #ffd700; color: #000; transform: translateY(-2px); }
        .screen-module { display: none; }
        .screen-module.active { display: block; }
        .card { background: rgba(52, 73, 94, 0.4); padding: 20px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        input, select, textarea {
            padding: 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px;
            background: rgba(52, 73, 94, 0.6); color: #ecf0f1; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { background: rgba(52, 73, 94, 0.8); outline: none; border-color: #ffd700; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        th { color: #ffd700; }
        .totale-evidenza-box { font-size: 22px; font-weight: bold; color: #2ecc71; margin-top: 15px; padding: 10px; background: rgba(46, 204, 113, 0.1); border-radius: 6px; border: 1px solid rgba(46, 204, 113, 0.2); text-align: center; }
        #loginScreen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .screen { display: none; }
        .screen.active { display: block; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #ffd700; }
        .workflow-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border-left: 5px solid #f1c40f; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .foto-provino { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 150px; position: relative; display: inline-block; margin: 10px; }
    </style>

    <script>
        // Carichiamo tutte le variabili e le funzioni nell'head in modo che siano subito disponibili
        let databaseClienti = JSON.parse(localStorage.getItem('suite_clienti')) || [];
        let databaseOfferte = JSON.parse(localStorage.getItem('suite_offerte')) || [];
        let databaseStudi = JSON.parse(localStorage.getItem('suite_studi')) || [];
        let databaseWorkflow = JSON.parse(localStorage.getItem('suite_workflow')) || [];
        let elencoCuoriciniSelezionati = [];

        function loginUniversale() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (u === 'admin' && p === '58879@Stella') {
                document.getElementById('loginScreen').classList.remove('active');
                document.getElementById('mainSuiteSection').classList.add('active');
                aggiornaPannelli();
            } else { 
                alert('Credenziali errate.'); 
            }
        }

        function logoutUniversale() {
            document.getElementById('mainSuiteSection').classList.remove('active');
            document.getElementById('loginSection').classList.add('active');
        }

        function attivaModulo(idModulo, idBottone) {
            document.querySelectorAll('.screen-module').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-menu button').forEach(btn => {
                btn.style.background = 'rgba(52, 73, 94, 0.8)'; btn.style.color = '#ecf0f1';
            });
            document.getElementById(idModulo).classList.add('active');
            const clicked = document.getElementById(idBottone);
            if(clicked) {
                clicked.style.background = '#ffd700'; clicked.style.color = '#000';
            }
        }

        function aggiornaPannelli() {
            const txtStudi = document.getElementById('txt-studi-totali');
            const txtOfferte = document.getElementById('txt-offerte-totali');
            if(txtStudi) txtStudi.innerText = databaseStudi.length;
            if(txtOfferte) txtOfferte.innerText = databaseOfferte.length;
            
            const sel = document.getElementById('admStudioOffer');
            if(sel) { sel.innerHTML = '<option value="">Scegli Offerta</option>' + databaseOfferte.map(o => `<option value="${o.titolo}">${o.titolo}</option>`).join(''); }
            renderizzaClienti();
            renderizzaWorkflowLista();
            renderizzaGrigliaVisualeProvini();
        }

        function adminAggiungiOfferta() {
            const t = document.getElementById('admOfferTitle').value.trim();
            const p = document.getElementById('admOfferPrice').value.trim();
            if(!t || !p) return alert('Compila i campi');
            databaseOfferte.push({titolo: t, prezzo: p});
            localStorage.setItem('suite_offerte', JSON.stringify(databaseOfferte));
            document.getElementById('admOfferTitle').value = ''; document.getElementById('admOfferPrice').value = '';
            aggiornaPannelli();
        }

        function adminAggiungiStudio() {
            const n = document.getElementById('admStudioName').value.trim();
            const r = document.getElementById('admStudioRef').value.trim();
            if(!n || !r) return alert('Compila i campi');
            databaseStudi.push({nome: n, referente: r});
            localStorage.setItem('suite_studi', JSON.stringify(databaseStudi));
            document.getElementById('admStudioName').value = ''; document.getElementById('admStudioRef').value = '';
            aggiornaPannelli();
        }

        function salvaNuovoCliente() {
            const nome = document.getElementById('cNome').value.trim();
            const cognome = document.getElementById('cCognome').value.trim();
            if(!nome || !cognome) return alert('Compila nome e cognome');
            
            const nId = 'CLI-' + Math.floor(100000 + Math.random() * 900000);
            const c = { id: nId, nome, cognome, tel: document.getElementById('cTel').value, email: document.getElementById('cEmail').value, ind: document.getElementById('cInd').value };
            databaseClienti.push(c);
            localStorage.setItem('suite_clienti', JSON.stringify(databaseClienti));

            databaseWorkflow.push({ id: 'WRK-' + Math.floor(1000 + Math.random() * 9000), cliente_id: nId, cliente_nome: nome + ' ' + cognome, step: 1, stato_foto: 'In lavorazione', stato_video: 'In lavorazione', consegnato: false });
            localStorage.setItem('suite_workflow', JSON.stringify(databaseWorkflow));

            document.getElementById('cNome').value = ''; document.getElementById('cCognome').value = '';
            document.getElementById('cTel').value = ''; document.getElementById('cEmail').value = ''; document.getElementById('cInd').value = '';
            aggiornaPannelli();
        }

        function renderizzaClienti() {
            const tbody = document.querySelector('#tabellaClienti tbody'); if(!tbody) return; tbody.innerHTML = '';
            if(databaseClienti.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">Nessun cliente in archivio.</td></tr>'; return; }
            databaseClienti.forEach(c => { tbody.innerHTML += `<tr><td>${c.id}</td><td><strong>${c.nome} ${c.cognome}</strong></td><td>📱 ${c.tel}<br>📧 ${c.email}</td><td>📍 ${c.ind}</td></tr>`; });
        }

        function mappaIndirizzo(fId) {
            const v = document.getElementById(fId).value.trim(); if(!v) return alert('Nessun indirizzo.');
            window.open('https://google.com' + encodeURIComponent(v), '_blank');
        }

        function eseguiCalcoloMatematico() {
