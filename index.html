<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppCenter Studio Premium Gold</title>
  <style>
    :root { --primary: #1e5571; --danger: #d9534f; --success: #5cb85c; }
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
    .hidden { display: none !important; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 40px auto; text-align: center; }
    input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn { background: var(--primary); color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn.green { background: var(--success); }
    .btn.danger { background: var(--danger); }
    .nav-bar { background: var(--primary); padding: 10px; border-radius: 4px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-bar button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
    .nav-bar button:hover { background: rgba(255,255,255,0.4); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #eee; }
    .grid-foto { display: grid; grid-template-columns: repeat(auto-fill, minmax(15px, 150px)); gap: 15px; margin-top: 15px; }
    .foto-card { background: white; padding: 10px; border: 1px solid #ddd; border-radius: 4px; text-align: center; position: relative; }
    .cuore { cursor: pointer; padding: 5px; background: #eee; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>

  <!-- LOGICA LOGISTICA BACKEND IN PRIMO PIANO -->
  <script>
    const WORKER_URL = 'https://workers.dev';
    let arrayServiziAggiunti = [];
    let cachePreventiviArchivio = [];
    let cacheClientiArchivio = [];
    let cacheWorkflowStati = {};
    let fotoGalleryLocali = [];
    let fotoSelezionateCuoricini = [];

    async function avviaProceduraLoginDiretta() {
      const sId = document.getElementById('login_studio_id').value.trim();
      const sToken = document.getElementById('login_studio_token').value.trim();
      if(!sId || !sToken) return alert('Compila i campi!');
      try {
        const r = await fetch(WORKER_URL + '/api/auth/login', {
          method:'POST', 
          headers:{'Content-Type':'application/json'}, 
          body:JSON.stringify({studio_id:sId, token:sToken})
        });
        const e = await r.json();
        if(r.ok && e.success) {
          localStorage.setItem('current_studio_id', sId);
          localStorage.setItem('studio_token', sToken);
          document.getElementById('lbl_studio_id').textContent = sId;
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('app-content').classList.remove('hidden');
          if(e.ruolo === 'admin') {
            document.getElementById('btn-nav-fornitore').classList.remove('hidden');
            mostraModulo('fornitore');
          } else {
            document.getElementById('btn-nav-fornitore').classList.add('hidden');
            mostraModulo('preventivi');
          }
        } else { alert('Errore: ' + (e.error || 'Credenziali errate')); }
      } catch(err) { alert('Errore server durante il login.'); }
    }

    function eseguiLogout() { localStorage.clear(); location.reload(); }

    function mostraModulo(idm) {
      ['fornitore','preventivi','archivio-prev','clienti','workflow','gru'].forEach(m=>{
        if(document.getElementById('mod-' + m)) document.getElementById('mod-' + m).classList.add('hidden');
      });
      if(document.getElementById('mod-' + idm)) document.getElementById('mod-' + idm).classList.remove('hidden');
      if(idm==='archivio-prev') caricaListaArchivioKV();
      if(idm==='clienti') caricaListaClientiKV();
      if(idm==='workflow') caricaTabelloneWorkflowKV();
      if(idm==='preventivi') sincronizzaSelettoreClientiRapido();
    }

    async function creaNuovoStudioSaaS() {
      const t = localStorage.getItem('studio_token'); 
      const id = document.getElementById('f_new_id').value.trim(); 
      const tk = document.getElementById('f_new_token').value.trim();
      if(!id || !tk) return alert('Mancano dati!');
      try {
        const r = await fetch(WORKER_URL + '/api/admin/crea-studio', {
          method:'POST', 
          headers:{'Content-Type':'application/json','X-Studio-Token':t}, 
          body:JSON.stringify({nuovo_studio_id:id, nuovo_token:tk})
        });
        if((await r.json()).success) { alert('Studio attivato!'); document.getElementById('f_new_id').value=''; document.getElementById('f_new_token').value=''; }
      } catch(e){}
    }

    async function salvaNuovoClienteKV() {
      const s = localStorage.getItem('current_studio_id'); 
      const t = localStorage.getItem('studio_token');
      const id = document.getElementById('c_id').value || 'CLIE-'+Math.floor(100000+Math.random()*900000);
      const data = {
        id:id, 
        note:document.getElementById('c_note').value.trim(),
        cliente_a:{nome:document.getElementById('ca_nome').value.trim(), cognome:document.getElementById('ca_cognome').value.trim(), telefono:document.getElementById('ca_telefono').value.trim(), email:document.getElementById('ca_email').value.trim(), indirizzo:document.getElementById('ca_indirizzo').value.trim()},
        cliente_b:{nome:document.getElementById('cb_nome').value.trim(), cognome:document.getElementById('cb_cognome').value.trim(), telefono:document.getElementById('cb_telefono').value.trim(), email:document.getElementById('cb_email').value.trim()},
        tipo_record:'cliente', 
        timestamp:new Date().toISOString()
      };
      if(!data.cliente_a.nome) return alert('Nome obbligatorio.');
      try {
        await fetch(WORKER_URL + '/api/kv-save', {
          method:'POST', 
          headers:{'Content-Type':'application/json','X-Studio-Token':t,'X-Studio-Id':s}, 
          body:JSON.stringify({studio_id:s, chiave:'cliente_' + id, dati:data})
        });
        alert('Cliente registrato!'); pulisciCampiClienti(); caricaListaClientiKV();
      } catch(e){}
    }

    async function caricaListaClientiKV() {
      const s = localStorage.getItem('current_studio_id'); 
      const t = localStorage.getItem('studio_token'); 
      const tb = document.getElementById('tabella-clienti-body');
      try {
        const r = await fetch(WORKER_URL + '/api/kv-load?studio_id=' + s, {headers:{'X-Studio-Token':t,'X-Studio-Id':s}});
        cacheClientiArchivio = (await r.json()).filter(x=>x && x.tipo_record==='cliente');
        tb.innerHTML = cacheClientiArchivio.map(c=>'<tr><td><strong>' + c.id + '</strong></td><td>' + c.cliente_a.nome + ' ' + c.cliente_a.cognome + '</td><td>' + c.cliente_a.telefono + '</td><td>' + (c.cliente_b.nome||'N/A') + '</td><td><button class="btn green" style="padding:4px 8px; font-size:11px;" onclick="riapriClientePerModifica(\'' + c.id + '\')">Carica</button></td></tr>').join('');
      } catch(e){ if(tb) tb.innerHTML='Errore caricamento.'; }
    }

    function riapriClientePerModifica(id) {
      const c = cacheClientiArchivio.find(x=>x.id===id); if(!c) return;
      document.getElementById('c_id').value=c.id; 
      document.getElementById('c_note').value=c.note||''; 
      document.getElementById('ca_nome').value=c.cliente_a.nome||''; 
      document.getElementById('ca_cognome').value=c.cliente_a.cognome||''; 
      document.getElementById('ca_telefono').value=c.cliente_a.telefono||''; 
      document.getElementById('ca_email').value=c.cliente_a.email||''; 
      document.getElementById('ca_indirizzo').value=c.cliente_a.indirizzo||''; 
      document.getElementById('cb_nome').value=c.cliente_b.nome||''; 
      document.getElementById('cb_cognome').value=c.cliente_b.cognome||''; 
      document.getElementById('cb_telefono').value=c.cliente_b.telefono||''; 
      document.getElementById('cb_email').value=c.cliente_b.email||'';
    }

    function pulisciCampiClienti() { 
      document.getElementById('c_id').value=''; 
      ['ca_nome','ca_cognome','ca_telefono','ca_email','ca_indirizzo','cb_nome','cb_cognome','cb_telefono','cb_email'].forEach(id=>{
        if(document.getElementById(id)) document.getElementById(id).value='';
      }); 
    }

    async function sincronizzaSelettoreClientiRapido() {
      const sel = document.getElementById('prev_selettore_cliente_rapido'); if(!sel) return;
      sel.innerHTML = '<option value="">-- Seleziona cliente --</option>'+cacheClientiArchivio.map(x=>'<option value="' + x.id + '">' + x.cliente_a.nome + ' ' + x.cliente_a.cognome + '</option>').join('');
    }

    function autoCompilaAnagraficaPreventivo() {
      const id = document.getElementById('prev_selettore_cliente_rapido').value; if(!id) return; 
      const c = cacheClientiArchivio.find(x=>x.id===id); if(!c) return;
      document.getElementById('a_nome').value=c.cliente_a.nome||''; 
      document.getElementById('a_cognome').value=c.cliente_a.cognome||''; 
      document.getElementById('a_telefono').value=c.cliente_a.telefono||''; 
      document.getElementById('a_email').value=c.cliente_a.email||''; 
      document.getElementById('a_via').value=c.cliente_a.indirizzo||''; 
      document.getElementById('b_nome').value=c.cliente_b.nome||''; 
      document.getElementById('b_cognome').value=c.cliente_b.cognome||''; 
      document.getElementById('b_telefono').value=c.cliente_b.telefono||''; 
      document.getElementById('b_email').value=c.cliente_b.email||'';
    }

    function aggiungiServizioRiga() {
