<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenterStudioPROGOLD - Login</title>
    <style>
        :root {
            --primary: #82e0aa;
            --primary-dark: #1e8449;
            --primary-light: #e8f8f5;
            --primary-gradient: linear-gradient(135deg, #a9dfbf 0%, #82e0aa 50%, #1e8449 100%);
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #e8f8f5 40%, #ebf5fb 100%);
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #e8e8e8;
            --danger: #e74c3c;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 480px; }
        .login-card {
            background: white;
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: 0 10px 30px rgba(30, 132, 73, 0.12);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--primary-gradient);
        }
        .logo-container { text-align: center; margin-bottom: 32px; }
        .logo {
            width: 80px; height: 80px; background: var(--primary-gradient); border-radius: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 800; color: white; margin-bottom: 16px;
        }
        .logo-text {
            font-size: 24px; font-weight: 800; background: var(--primary-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px;
        }
        .logo-subtext { font-size: 13px; color: var(--text-light); }
        .login-title { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 24px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 16px; position: relative; }
        .form-group label { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input {
            padding: 12px 45px 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            flex: 1;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-light);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password:hover { color: var(--primary-dark); }
        .form-group input[type="text"] {
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(130, 224, 170, 0.2);
        }
        .btn {
            padding: 14px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
            cursor: pointer; width: 100%; background: var(--primary-gradient); color: white; margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); }
        .login-type-selector {
            display: flex; gap: 8px; margin-bottom: 24px; background: var(--primary-light); padding: 4px; border-radius: 10px;
        }
        .login-type-btn {
            flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-light);
        }
        .login-type-btn.active { background: white; color: var(--primary-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .login-form { display: none; }
        .login-form.active { display: block; }
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 2000; }
        .toast {
            background: white; border-radius: 10px; padding: 14px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            margin-bottom: 10px; border-left: 4px solid var(--primary); animation: slideIn 0.3s ease;
        }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo">AC</div>
                <div class="logo-text">AppCenterStudioPROGOLD</div>
                <div class="logo-subtext">Piattaforma Cloud Multi-Dispositivo</div>
            </div>
            <div class="login-title">Accedi al tuo account</div>
            <div class="login-type-selector">
                <button class="login-type-btn active" onclick="switchLoginType('studio')">Studio</button>
                <button class="login-type-btn" onclick="switchLoginType('admin')">Admin</button>
                <button class="login-type-btn" onclick="switchLoginType('cliente')">Cliente</button>
            </div>
            <div class="login-form active" id="formStudio">
                <div class="form-group">
                    <label>ID Studio</label>
                    <input type="text" id="studioId" placeholder="es. studio-gold" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="studioPassword" placeholder="Inserisci la password" autocomplete="off">
                        <button type="button" class="toggle-password" onclick="togglePassword('studioPassword', this)">👁️</button>
                    </div>
                </div>
                <button class="btn" onclick="login('studio', 'studioId', 'studioPassword')">ACCEDI</button>
            </div>
            <div class="login-form" id="formAdmin">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="adminId" placeholder="admin" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="adminPassword" placeholder="Password admin" autocomplete="off">
                        <button type="button" class="toggle-password" onclick="togglePassword('adminPassword', this)">️</button>
                    </div>
                </div>
                <button class="btn" onclick="login('admin', 'adminId', 'adminPassword')">ACCEDI</button>
            </div>
            <div class="login-form" id="formCliente">
                <div class="form-group">
                    <label>ID Cliente</label>
                    <input type="text" id="clienteId" placeholder="es. cliente-rossi" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="clientePassword" placeholder="Inserisci la password" autocomplete="off">
                        <button type="button" class="toggle-password" onclick="togglePassword('clientePassword', this)">👁️</button>
                    </div>
                </div>
                <button class="btn" onclick="login('cliente', 'clienteId', 'clientePassword')">ACCEDI</button>
            </div>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const WORKER_URL = "https://appcenter-backend.mairaluigi-b2f.workers.dev";

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '';
            } else {
                input.type = 'password';
                btn.textContent = '️';
            }
        }

        function switchLoginType(type) {
            document.querySelectorAll('.login-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.login-form').forEach(form => form.classList.remove('active'));
            document.getElementById('form' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('active');
            
            // Pulisci tutti i campi quando cambi tab
            document.querySelectorAll('input').forEach(input => {
                input.value = '';
            });
        }

        async function login(tipo, idField, passField) {
            const id = document.getElementById(idField).value.trim();
            const password = document.getElementById(passField).value;
            if (!id || !password) { mostraToast('Compila tutti i campi', 'error'); return; }

            try {
                const response = await fetch(`${WORKER_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo, id, password })
                });
                const data = await response.json();

                if (data.success) {
                    mostraToast('Accesso effettuato!', 'success');
                    setTimeout(() => {
                        if (tipo === 'admin') window.location.href = `admin.html?token=${data.token}`;
                        else if (tipo === 'studio') window.location.href = `plancia-studio.html?token=${data.token}`;
                        else if (tipo === 'cliente') window.location.href = `dashboard-cliente.html?token=${data.token}`;
                    }, 500);
                } else {
                    mostraToast(data.error || 'Credenziali non valide', 'error');
                }
            } catch (error) {
                mostraToast('Errore di connessione', 'error');
            }
        }

        function mostraToast(msg, tipo) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = `<div>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
