<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AppCenterStudioPROGOLD</title>
    <link rel="stylesheet" href="temi.css">
    <script src="temi.js"></script>
    
    <!-- ============================================ -->
    <!-- SEZIONE 1: CSS STYLES (righe 1-150) -->
    <!-- ============================================ -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #ffffff; min-height: 100vh; color: #000000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { background: #ffffff; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #d5d8dc; border-top: 5px solid #d4af37; max-width: 450px; width: 100%; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { color: #000000; font-size: 1.8em; margin-bottom: 10px; font-weight: 700; }
        .login-header p { color: #666666; font-size: 0.95em; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #000000; font-weight: 600; font-size: 0.9em; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 2px solid #d5d8dc; border-radius: 10px; font-size: 0.95em; background: #f8f9fa; color: #000000; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #d4af37; background: #ffffff; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 50px; }
        .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666666; font-size: 1.2em; padding: 5px; }
        .toggle-password:hover { color: #d4af37; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 1em; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #996515); color: #ffffff; }
        .btn-outline { background: transparent; border: 2px solid #d4af37; color: #996515; }
        .error-message, .success-message { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; border-left: 4px solid; font-weight: 600; }
        .error-message { background: #fadbd8; color: #c0392b; border-left-color: #c0392b; }
        .success-message { background: #d5f5e3; color: #1e8449; border-left-color: #1e8449; }
        .loading { text-align: center; padding: 20px; color: #666666; display: none; }
        .spinner { border: 4px solid #fff9e6; border-top: 4px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #ffffff; padding: 40px; border-radius: 15px; max-width: 500px; width: 90%; border-top: 5px solid #d4af37; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #fff9e6; }
        .modal-header h2 { color: #000000; font-size: 1.4em; }
        .close-modal { background: none; border: none; font-size: 1.8em; cursor: pointer; color: #666666; }
        .info-box { background: #fff9e6; padding: 15px; border-radius: 8px; border-left: 4px solid #d4af37; margin-bottom: 20px; }
        .footer-branding { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #d5d8dc; color: #666666; font-size: 0.85em; }
        .footer-branding strong { color: #996515; }
    </style>
</head>
<body>
    
    <!-- ============================================ -->
    <!-- SEZIONE 2: HTML LOGIN FORM (righe 151-200) -->
    <!-- ============================================ -->
    <div class="login-container">
        <div class="login-header">
            <h1>AppCenterStudioPROGOLD</h1>
            <p>Accedi al tuo pannello di gestione</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="login-form" onsubmit="effettuaLogin(event)">
            <div class="form-group">
                <label>Tipo Account *</label>
                <select id="tipo" required>
                    <option value="">-- Seleziona --</option>
                    <option value="admin">Amministratore</option>
                    <option value="studio">Studio Fotografico</option>
                    <option value="cliente">Cliente</option>
                </select>
            </div>

            <div class="form-group">
                <label>ID / Username *</label>
                <input type="text" id="id" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">ACCEDI</button>
            <button type="button" class="btn btn-outline" onclick="mostraRegistrazione()">REGISTRA NUOVO STUDIO</button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Verifica credenziali...</p>
        </div>

        <div class="footer-branding">
            <p>Piattaforma sviluppata da <strong>AppCenterStudioPROGOLD</strong></p>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SEZIONE 3: HTML MODALE (righe 201-250) -->
    <!-- ============================================ -->
    <div id="modal-registrazione" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Registra Nuovo Studio</h2>
                <button class="close-modal" onclick="chiudiRegistrazione()">x</button>
            </div>
            
            <div class="info-box">
                Compila il form per richiedere un account di prova
            </div>
            
            <form id="form-registrazione" onsubmit="registraStudio(event)">
                <div class="form-group">
                    <label>Nome Studio *</label>
                    <input type="text" id="reg_nome" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="reg_email" required>
                </div>
                <div class="form-group">
                    <label>Telefono</label>
                    <input type="tel" id="reg_telefono">
                </div>
                <div class="form-group">
                    <label>Partita IVA</label>
                    <input type="text" id="reg_piva">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg_password" required>
                        <button type="button" class="toggle-password" onclick="toggleRegPassword()">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">INVIA RICHIESTA</button>
                <button type="button" class="btn btn-outline" onclick="chiudiRegistrazione()">ANNULLA</button>
            </form>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SEZIONE 4: JAVASCRIPT (righe 251-350) -->
    <!-- ============================================ -->
    <script>
        var WORKER_URL = 'https://appcenter-backend.mairaluigi-b2f.workers.dev';

        function mostraErrore(msg) {
            var el = document.getElementById('error-message');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(function() { el.style.display = 'none'; }, 5000);
        }

        function mostraSuccesso(msg) {
            var el = document.getElementById('success-message');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(function() { el.style.display = 'none'; }, 5000);
        }

        async function effettuaLogin(event) {
            event.preventDefault();
            var tipo = document.getElementById('tipo').value;
            var id = document.getElementById('id').value;
            var password = document.getElementById('password').value;
            
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            try {
                var response = await fetch(WORKER_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: tipo, id: id, password: password })
                });
                var data = await response.json();
                
                if (data.success) {
                    mostraSuccesso('Login effettuato!');
                    setTimeout(function() {
                        if (tipo === 'admin') window.location.href = 'admin.html?token=' + encodeURIComponent(data.token);
                        else if (tipo === 'studio') window.location.href = 'plancia-studio.html?token=' + encodeURIComponent(data.token);
                        else if (tipo === 'cliente') window.location.href = 'dashboard-cliente.html?token=' + encodeURIComponent(data.token);
                    }, 1000);
                } else {
                    mostraErrore(data.error || 'Credenziali non valide');
                    document.getElementById('login-form').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                mostraErrore('Errore di connessione');
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }

        function togglePassword() {
            var f = document.getElementById('password');
            f.type = f.type === 'password' ? 'text' : 'password';
        }

        function toggleRegPassword() {
            var f = document.getElementById('reg_password');
            f.type = f.type === 'password' ? 'text' : 'password';
        }

        function mostraRegistrazione() { document.getElementById('modal-registrazione').classList.add('active'); }
        function chiudiRegistrazione() { document.getElementById('modal-registrazione').classList.remove('active'); }

        async function registraStudio(event) {
            event.preventDefault();
            var dati = {
                nome: document.getElementById('reg_nome').value,
                email: document.getElementById('reg_email').value,
                telefono: document.getElementById('reg_telefono').value,
                piva: document.getElementById('reg_piva').value,
                password: document.getElementById('reg_password').value,
                data_registrazione: new Date().toISOString().split('T')[0]
            };
            
            try {
                var response = await fetch(WORKER_URL + '/api/public/registra-studio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dati)
                });
                var result = await response.json();
                if (result.success) {
                    mostraSuccesso('Richiesta inviata!');
                    chiudiRegistrazione();
                } else {
                    mostraErrore(result.error || 'Errore');
                }
            } catch (error) {
                mostraErrore('Errore di connessione');
            }
        }

        document.getElementById('modal-registrazione').addEventListener('click', function(e) {
            if (e.target === this) chiudiRegistrazione();
        });
    </script>
</body>
</html>
