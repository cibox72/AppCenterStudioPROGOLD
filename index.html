<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite Premium - AppCenter Studio Gold</title>
    <style>
        :root {
            --carta-zucchero: #7ea4b5;
            --verde-salvia: #9caf88;
            --rosa-antico: #dcaeaf;
            --scuro: #2b3a42;
            --chiaro: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--chiaro);
            color: var(--scuro);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1, h2, h3, h4 { color: var(--scuro); text-align: center; }
        .grid-ingressi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card-login {
            border: 2px solid var(--carta-zucchero);
            border-radius: 8px;
            padding: 20px;
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .card-login.admin { border-color: var(--rosa-antico); }
        .card-login.studio { border-color: var(--verde-salvia); }
        
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px;
        }
        .toggle-password-eye {
            position: absolute;
            right: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 18px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: var(--carta-zucchero);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .btn-admin { background-color: var(--rosa-antico); }
        .btn-studio { background-color: var(--verde-salvia); }
        .pannello-privato { display: none; margin-top: 30px; padding: 20px; border-radius: 8px; background: #fafafa; border: 1px solid #ddd; }
        .grid-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <h2 style="color: var(--carta-zucchero); margin: 0;">✨ AppCenter Studio Premium</h2>
    </div>

    <div id="sezione-ingressi">
        <h1>Punto di accesso unico per Fornitori, Studi e Clienti</h1>
        <div class="grid-ingressi">
            
            <div class="card-login">
                <h3>👥 Accesso Clienti (Sposi)</h3>
                <input type="text" id="id-sposi" placeholder="ID Sposi Permanente *">
                <div class="password-container">
                    <input type="password" id="pass-sposi" placeholder="Password Galleria *">
                    <span class="toggle-password-eye" onclick="invertiVisibilitaPassword('pass-sposi', this)">👁️</span>
                </div>
                <button onclick="azioneLoginCliente()">Sblocca Galleria ❤️</button>
            </div>

            <div class="card-login studio">
                <h3>📸 Cabina Regia Studio</h3>
                <input type="text" id="id-studio" placeholder="ID Studio Permanente *">
                <div class="password-container">
                    <input type="password" id="pass-studio" placeholder="Password Studio *">
                    <span class="toggle-password-eye" onclick="invertiVisibilitaPassword('pass-studio', this)">👁️</span>
                </div>
                <button class="btn-studio" onclick="azioneLoginStudio()">Entra in Plancia</button>
            </div>

            <div class="card-login admin">
                <h3>👑 Fornitore Supremo</h3>
                <div class="password-container">
                    <input type="password" id="pass-admin" placeholder="Chiave di Accesso Suprema *">
                    <span class="toggle-password-eye" onclick="invertiVisibilitaPassword('pass-admin', this)">👁️</span>
                </div>
                <button class="btn-admin" onclick="azioneLoginAdmin()">Accedi al Server</button>
            </div>
        </div>
    </div>

    <div id="pannello-admin" class="pannello-privato">
        <h2>👑 Pannello Fornitore Supremo - Gestione Licenze</h2>
        <h4>Crea / Modifica Stato Licenza Studio</h4>
        <input type="text" id="id-studio-permanente" placeholder="ID Studio Permanente *">
        <input type="text" id="password-studio" placeholder="Password Studio *">
        <select id="stato-licenza-select">
            <option value="PROVA">⏳ In Prova Omaggio (15 GG)</option>
            <option value="ATTIVA" selected>🟢 Licenza Attiva</option>
            <option value="SOSPESA">🔴 Sospeso (Spegni Accesso)</option>
        </select>
        <button class="btn-admin" onclick="salvaLicenzaStudio()">SALVA CONFIGURAZIONE SERVER</button>
        <button onclick="esciSessione()">Esci Sessione</button>
    </div>

    <div id="pannello-studio" class="pannello-privato">
        <h2>📸 Cabina di Regia Studio: <span id="nome-studio-attivo"></span></h2>
        <div class="grid-dashboard">
            <button class="btn-studio" onclick="location.href='preventivi.html'">📋 Preventivi & Contratti</button>
            <button class="btn-studio" onclick="location.href='agenda.html'">📅 Agenda Studio</button>
            <button class="btn-studio" onclick="location.href='workflow.html'">⚙️ Workflow Produzione</button>
            <button class="btn-studio" onclick="location.href='negozio.html'">🛒 Negozio & Ordini</button>
            <button class="btn-studio" onclick="location.href='ricevute.html'">🧾 Cassa & Ricevute</button>
            <button class="btn-studio" onclick="location.href='clienti-foto.html'">📸 Carica Foto R2</button>
            <button class="btn-studio" onclick="location.href='selezione-album.html'">🔗 Monitor Selezioni</button>
            <button class="btn-studio" onclick="location.href='email.html'">📩 Email & Modelli</button>
            <button class="btn-studio" onclick="location.href='gru.html'">⚙️ Utilità GRU</button>
            <button class="btn-studio" onclick="location.href='lista-regali.html'">🎁 Lista Nozze</button>
        </div>
        <br>
        <button onclick="esciSessione()">Esci Sessione</button>
    </div>
</div>

<script>
const WORKER_URL = "https://workers.dev";

function invertiVisibilitaPassword(inputId, elementoOcchio) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        elementoOcchio.innerText = "🙈";
    } else {
        input.type = "password";
        elementoOcchio.innerText = "👁️";
    }
}

function mostraPannelloFornitore() {
    document.getElementById("sezione-ingressi").style.display = "none";
    document.getElementById("pannello-admin").style.display = "block";
}

function mostraPannelloStudio() {
    document.getElementById("sezione-ingressi").style.display = "none";
    document.getElementById("pannello-studio").style.display = "block";
    document.getElementById("nome-studio-attivo").innerText = window.currentStudioId;
}

function esciSessione() { location.reload(); }

async function azioneLoginAdmin() {
    const password = document.getElementById("pass-admin").value;
    try {
        const r = await fetch(`${WORKER_URL}/api/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
        });
        const d = await r.json();
        if (d.success) mostraPannelloFornitore();
        else alert("Password errata!");
    } catch { alert("Errore di connessione a Cloudflare"); }
}

async function salvaLicenzaStudio() {
    const studioId = document.getElementById("id-studio-permanente").value;
    const password = document.getElementById("password-studio").value;
    const stato = document.getElementById("stato-licenza-select").value;
    const active = stato !== "SOSPESA";

    try {
        const r = await fetch(`${WORKER_URL}/api/admin/studio`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ studioId, password, active })
        });
        const d = await r.json();
        if(d.success) alert("Licenza Studio registrata sul server!");
    } catch { alert("Errore di salvataggio licenza"); }
}

async function azioneLoginStudio() {
    const studioId = document.getElementById("id-studio").value;
    const password = document.getElementById("pass-studio").value;
    try {
        const r = await fetch(`${WORKER_URL}/api/studio/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ studioId, password })
        });
        const d = await r.json();
        if (d.success) {
            window.currentStudioId = studioId;
            window.localStorage.setItem("studioId", studioId);
            mostraPannelloStudio();
        } else alert("Errore: " + d.error);
