<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AppCenterStudioPROGOLD</title>
    <link rel="stylesheet" href="temi.css">
    <script src="temi.js"></script>
    
    <!-- ============================================ -->
    <!-- SEZIONE 1: CSS STYLES -->
    <!-- ============================================ -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #ffffff;
            min-height: 100vh;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #d5d8dc;
            border-top: 5px solid #d4af37;
            max-width: 450px;
            width: 100%;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #000000;
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .login-header p {
            color: #666666;
            font-size: 0.95em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #000000;
            font-weight: 600;
            font-size: 0.9em;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #d5d8dc;
            border-radius: 10px;
            font-size: 0.95em;
            background: #f8f9fa;
            color: #000000;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d4af37;
            background: #ffffff;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            padding-right: 50px;
        }
        
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666666;
            font-size: 1.2em;
            padding: 5px;
        }
        
        .toggle-password:hover {
            color: #d4af37;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #996515);
            color: #ffffff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #d4af37;
            color: #996515;
        }
        
        .btn-outline:hover {
            background: #fff9e6;
        }
        
        .error-message {
            background: #fadbd8;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c0392b;
            font-weight: 600;
        }
        
        .success-message {
            background: #d5f5e3;
            color: #1e8449;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #1e8449;
            font-weight: 600;
        }
        
        .footer-branding {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #d5d8dc;
            color: #666666;
            font-size: 0.85em;
        }
        
        .footer-branding strong {
            color: #996515;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666666;
            display: none;
        }
        
        .spinner {
            border: 4px solid #fff9e6;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 5px solid #d4af37;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #fff9e6;
        }
        
        .modal-header h2 {
            color: #000000;
            font-size: 1.4em;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.8em;
            cursor: pointer;
            color: #666666;
            transition: color 0.3s ease;
        }
        
        .close-modal:hover {
            color: #c0392b;
        }
        
        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .modal-actions .btn {
            flex: 1;
            min-width: 120px;
        }
        
        .info-box {
            background: #fff9e6;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #d4af37;
            margin-bottom: 20px;
            color: #000000;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .login-container {
                padding: 25px;
            }
            
            .modal-content {
                padding: 25px;
            }
            
            .modal-actions {
                flex-direction: column;
            }
            
            .modal-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- SEZIONE 2: HTML STRUCTURE - LOGIN FORM -->
    <!-- ============================================ -->
    <div class="login-container">
        <div class="login-header">
            <h1>AppCenterStudioPROGOLD</h1>
            <p>Accedi al tuo pannello di gestione</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="login-form" onsubmit="effettuaLogin(event)">
            <div class="form-group">
                <label>Tipo Account *</label>
                <select id="tipo" required>
                    <option value="">-- Seleziona --</option>
                    <option value="admin">Amministratore</option>
                    <option value="studio">Studio Fotografico</option>
                    <option value="cliente">Cliente</option>
                </select>
            </div>

            <div class="form-group">
                <label>ID / Username *</label>
                <input type="text" id="id" required placeholder="Inserisci il tuo ID">
            </div>

            <div class="form-group">
                <label>Password *</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required placeholder="Inserisci la password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">ACCEDI</button>
            <button type="button" class="btn btn-outline" onclick="mostraRegistrazione()">REGISTRA NUOVO STUDIO</button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Verifica credenziali...</p>
        </div>

        <div class="footer-branding">
            <p>Piattaforma sviluppata da <strong>AppCenterStudioPROGOLD</strong></p>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SEZIONE 3: HTML STRUCTURE - MODALE REGISTRAZIONE -->
    <!-- ============================================ -->
    <div id="modal-registrazione" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Registra Nuovo Studio</h2>
                <button class="close-modal" onclick="chiudiRegistrazione()">x</button>
            </div>
            
            <div class="info-box">
                Compila il form per richiedere un account di prova. Riceverai una email di conferma con le credenziali di accesso.
            </div>
            
            <form id="form-registrazione" onsubmit="registraStudio(event)">
                <div class="form-group">
                    <label>Nome Studio *</label>
                    <input type="text" id="reg_nome" required placeholder="Nome del tuo studio">
                </div>
                
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="reg_email" required placeholder="email@studio.it">
                </div>
                
                <div class="form-group">
                    <label>Telefono</label>
                    <input type="tel" id="reg_telefono" placeholder="+39 333 1234567">
                </div>
                
                <div class="form-group">
                    <label>Partita IVA</label>
                    <input type="text" id="reg_piva" placeholder="Partita IVA">
                </div>
                
                <div class="form-group">
                    <label>Indirizzo</label>
                    <input type="text" id="reg_indirizzo" placeholder="Via Roma 123">
                </div>
                
                <div class="form-group">
                    <label>Citta</label>
                    <input type="text" id="reg_citta" placeholder="Roma">
                </div>
                
                <div class="form-group">
                    <label>Provincia</label>
                    <input type="text" id="reg_provincia" placeholder="RM">
                </div>
                
                <div class="form-group">
                    <label>Password *</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg_password" required placeholder="Scegli una password">
                        <button type="button" class="toggle-password" onclick="toggleRegPassword()">👁️</button>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">INVIA RICHIESTA</button>
                    <button type="button" class="btn btn-outline" onclick="chiudiRegistrazione()">ANNULLA</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SEZIONE 4: JAVASCRIPT FUNCTIONS -->
    <!-- ============================================ -->
    <script>
        var WORKER_URL = 'https://appcenter-backend.mairaluigi-b2f.workers.dev';

        function mostraErrore(messaggio) {
            var errorDiv = document.getElementById('error-message');
            errorDiv.textContent = messaggio;
            errorDiv.style.display = 'block';
            setTimeout(function() { errorDiv.style.display = 'none'; }, 5000);
        }

        function mostraSuccesso(messaggio) {
            var successDiv = document.getElementById('success-message');
            successDiv.textContent = messaggio;
            successDiv.style.display = 'block';
            setTimeout(function() { successDiv.style.display = 'none'; }, 5000);
        }

        async function effettuaLogin(event) {
            event.preventDefault();
            
            var tipo = document.getElementById('tipo').value;
            var id = document.getElementById('id').value;
            var password = document.getElementById('password').value;
            
            if (!tipo || !id || !password) {
                mostraErrore('Compila tutti i campi obbligatori.');
                return;
            }
            
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            try {
                var response = await fetch(WORKER_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: tipo, id: id, password: password })
                });
                
                var data = await response.json();
                
                if (data.success) {
                    mostraSuccesso('Login effettuato! Reindirizzamento...');
                    
                    setTimeout(function() {
                        if (tipo === 'admin') {
                            window.location.href = 'admin.html?token=' + encodeURIComponent(data.token);
                        } else if (tipo === 'studio') {
                            window.location.href = 'plancia-studio.html?token=' + encodeURIComponent(data.token);
                        } else if (tipo === 'cliente') {
                            window.location.href = 'dashboard-cliente.html?token=' + encodeURIComponent(data.token);
                        }
                    }, 1000);
                } else {
                    mostraErrore(data.error || 'Credenziali non valide.');
                    document.getElementById('login-form').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                console.error('Errore login:', error);
                mostraErrore('Errore di connessione. Riprova.');
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }

        function togglePassword() {
            var passwordField = document.getElementById('password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }

        function toggleRegPassword() {
            var passwordField = document.getElementById('reg_password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }

        function mostraRegistrazione() {
            document.getElementById('modal-registrazione').classList.add('active');
        }

        function chiudiRegistrazione() {
            document.getElementById('modal-registrazione').classList.remove('active');
            document.getElementById('form-registrazione').reset();
        }

        async function registraStudio(event) {
            event.preventDefault();
            
            var dati = {
                nome: document.getElementById('reg_nome').value,
                email: document.getElementById('reg_email').value,
                telefono: document.getElementById('reg_telefono').value,
                piva: document.getElementById('reg_piva').value,
                indirizzo: document.getElementById('reg_indirizzo').value,
                citta: document.getElementById('reg_citta').value,
                stato: document.getElementById('reg_provincia').value,
                password: document.getElementById('reg_password').value,
                data_registrazione: new Date().toISOString().split('T')[0],
                scadenza: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
            };
            
            try {
                var response = await fetch(WORKER_URL + '/api/public/registra-studio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dati)
                });
                
                var result = await response.json();
                
                if (result.success) {
                    mostraSuccesso('Richiesta inviata! Riceverai una email di conferma.');
                    chiudiRegistrazione();
                } else {
                    mostraErrore(result.error || 'Errore nella registrazione.');
                }
            } catch (error) {
                console.error('Errore registrazione:', error);
                mostraErrore('Errore di connessione.');
            }
        }

        // Chiudi modale cliccando fuori
        document.getElementById('modal-registrazione').addEventListener('click', function(e) {
            if (e.target === this) {
                chiudiRegistrazione();
            }
        });
    </script>
</body>
</html>
