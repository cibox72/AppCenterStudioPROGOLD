<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenter Studio Premium Gold</title>
    <style>
        /* Sfondo Premium Elegante Geometrico recuperato dai tuoi vecchi file */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c4c 0%, #2a4a5e 30%, #3d5a6c 70%, #2c3e50 100%),
                        repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(255, 255, 255, 0.02) 30px, rgba(255, 255, 255, 0.02) 60px);
            background-size: cover, 100px 100px;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: #ecf0f1;
            overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%),
                        linear-gradient(-45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%);
            pointer-events: none; z-index: 0;
        }
        .container {
            max-width: 1200px; margin: 0 auto; background: rgba(44, 62, 80, 0.95);
            border-radius: 15px; padding: 30px; box-shadow: 0 4px 30px rgba(0,0,0,0.3), 0 0 60px rgba(0,0,0,0.4);
            position: relative; z-index: 1; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        header h1 { color: #ffd700; font-size: 2.3em; font-weight: 300; letter-spacing: 2px; }
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        button {
            background: rgba(52, 73, 94, 0.8); color: #ecf0f1; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all 0.3s;
        }
        button:hover { background: #ffd700; color: #000; transform: translateY(-2px); }
        .screen { display: none; }
        .screen.active { display: block; }
        .card { background: rgba(52, 73, 94, 0.4); padding: 20px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        input, select, textarea {
            padding: 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px;
            background: rgba(52, 73, 94, 0.6); color: #ecf0f1; width: 100%; box-sizing: border-box; margin-bottom: 10px;
        }
        input:focus { background: rgba(52, 73, 94, 0.8); outline: none; border-color: #ffd700; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        th { color: #ffd700; }
    </style>
</head>
<body>

    <!-- PLESAL PER IL LOGIN -->
    <div id="loginSection" class="screen active" style="max-width: 400px; margin: 100px auto;">
        <div class="card" style="text-align: center;">
            <h2 style="color: #ffd700; margin-bottom: 15px;">🔐 Accesso Suite Premium</h2>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="58879@Stella">
            <button onclick="loginUniversale()" style="width: 100%; margin-top: 10px; background: #ffd700; color: #000;">Entra nel Sistema</button>
        </div>
    </div>

    <!-- PANNELLO PRINCIPALE CONTENITORE -->
    <div id="mainSuiteSection" class="screen">
        <div class="container">
            <header>
                <h1>🎨 AppCenter Studio Premium Gold</h1>
                <p style="color: #aaa; margin-top: 5px;">Suite Gestionale Privata v16.8</p>
            </header>

            <!-- Menu Navigazione Superiore -->
            <div class="nav-menu">
                <button onclick="cambiaSchermata('planciaFornitore')">👑 Plancia Fornitore</button>
                <button onclick="alert('Il Modulo 01 verrà integrato al prossimo passo')">📝 01 Preventivi</button>
                <button onclick="alert('Il Modulo 02 verrà integrato al prossimo passo')">👤 02 Clienti</button>
                <button onclick="alert('Il Modulo 03 verrà integrato al prossimo passo')">⚙️ 03 Workflow</button>
                <button onclick="logoutUniversale()" style="background: #e74c3c;">🚪 Esci dallo Studio</button>
            </div>

            <!-- SOTTO-SCHERMATA: PLANCIA FORNITORE SUPREMO -->
            <div id="planciaFornitore" class="screen active">
                <div class="grid">
                    <div class="card" style="text-align: center;">
                        <h3>Studi Attivi nel Cloud</h3>
                        <p style="font-size: 2.5em; color: #ffd700; font-weight: 300;">0</p>
                    </div>
                    <div class="card" style="text-align: center;">
                        <h3>Offerte Configurate</h3>
                        <p style="font-size: 2.5em; color: #ffd700; font-weight: 300;">0</p>
                    </div>
                </div>

                <div class="grid" style="margin-top: 20px;">
                    <div class="card">
                        <h3>➕ Configura Nuovo Studio</h3>
                        <input type="text" placeholder="Nome Studio">
                        <input type="text" placeholder="Referente">
                        <select><option>Scegli Offerta</option></select>
                        <button style="width:100%;">Salva Studio</button>
                    </div>
                    <div class="card">
                        <h3>🏷️ Gestione Offerte</h3>
                        <button style="width:100%;">🏷️ Aggiungi Offerta</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function loginUniversale() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (u === 'admin' && p === '58879@Stella') {
                document.getElementById('loginSection').classList.remove('active');
                document.getElementById('mainSuiteSection').classList.add('active');
            } else {
                alert('Credenziali errate.');
            }
        }

        function logoutUniversale() {
            document.getElementById('mainSuiteSection').classList.remove('active');
            document.getElementById('loginSection').classList.add('active');
        }

        function cambiaSchermata(idSchermata) {
            // Predisposizione per la navigazione dei moduli successivi
            alert('Navigazione pronta per ricevere i moduli.');
        }
    </script>
</body>
</html>
