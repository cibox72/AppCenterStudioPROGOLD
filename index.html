<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenter Studio Premium Gold</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c4c 0%, #2a4a5e 30%, #3d5a6c 70%, #2c3e50 100%),
                        repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(255, 255, 255, 0.02) 30px, rgba(255, 255, 255, 0.02) 60px);
            background-size: cover, 100px 100px;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: #ecf0f1;
            overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%),
                        linear-gradient(-45deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%);
            pointer-events: none; z-index: 0;
        }
        .container {
            max-width: 1200px; margin: 0 auto; background: rgba(44, 62, 80, 0.95);
            border-radius: 15px; padding: 30px; box-shadow: 0 4px 30px rgba(0,0,0,0.3), 0 0 60px rgba(0,0,0,0.4);
            position: relative; z-index: 1; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
        header h1 { color: #ffd700; font-size: 2.3em; font-weight: 300; letter-spacing: 2px; }
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        button {
            background: rgba(52, 73, 94, 0.8); color: #ecf0f1; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all 0.3s; font-weight: bold;
        }
        button:hover { background: #ffd700; color: #000; transform: translateY(-2px); }
        .screen-module { display: none; }
        .screen-module.active { display: block; }
        .card { background: rgba(52, 73, 94, 0.4); padding: 20px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        input, select, textarea {
            padding: 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px;
            background: rgba(52, 73, 94, 0.6); color: #ecf0f1; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { background: rgba(52, 73, 94, 0.8); outline: none; border-color: #ffd700; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        th { color: #ffd700; }
        .totale-evidenza-box { font-size: 22px; font-weight: bold; color: #2ecc71; margin-top: 15px; padding: 10px; background: rgba(46, 204, 113, 0.1); border-radius: 6px; border: 1px solid rgba(46, 204, 113, 0.2); text-align: center; }
        #loginScreen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .screen { display: none; }
        .screen.active { display: block; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #ffd700; }
        .workflow-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border-left: 5px solid #f1c40f; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .foto-provino { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 150px; position: relative; display: inline-block; margin: 10px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN -->
    <div id="loginScreen" class="screen active">
        <div class="card" style="width: 360px; text-align: center; position: relative; z-index: 10;">
            <h2 style="color: #ffd700; margin-bottom: 15px;">🔐 Accesso Suite Premium</h2>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="58879@Stella">
            <button onclick="loginUniversale()" style="width: 100%; margin-top: 10px; background: #ffd700; color: #000;">Entra nel Sistema</button>
        </div>
    </div>

    <!-- 2. PANNELLO CONTENITORE -->
    <div id="mainSuiteSection" class="screen">
        <div class="container">
            <header>
                <h1>🎨 AppCenter Studio Premium Gold</h1>
                <p style="color: #aaa; margin-top: 5px;">Suite Gestionale Privata v16.8</p>
            </header>

            <!-- Menu Navigazione -->
            <div class="nav-menu">
                <button id="btn-plancia" onclick="attivaModulo('planciaFornitore', 'btn-plancia')" style="background:#ffd700; color:#000;">👑 Plancia Fornitore</button>
                <button id="btn-prev" onclick="attivaModulo('moduloPreventivi', 'btn-prev')" style="background:rgba(52, 73, 94, 0.8); color:#ecf0f1;">📝 01 Preventivi</button>
                <button id="btn-cli" onclick="attivaModulo('moduloClienti', 'btn-cli')" style="background:rgba(52, 73, 94, 0.8); color:#ecf0f1;">👤 02 Clienti</button>
                <button id="btn-work" onclick="attivaModulo('moduloWorkflow', 'btn-work')" style="background:rgba(52, 73, 94, 0.8); color:#ecf0f1;">⚙️ 03 Workflow</button>
                <button id="btn-foto" onclick="attivaModulo('moduloFotoGru', 'btn-foto')" style="background:rgba(52, 73, 94, 0.8); color:#ecf0f1;">📸 04 Configura GRU</button>
                <button onclick="logoutUniversale()" style="background: #e74c3c; color:#fff;">🚪 Esci dallo Studio</button>
            </div>

            <!-- TAB: PLANCIA FORNITORE SUPREMO -->
            <div id="planciaFornitore" class="screen-module active">
                <div class="grid">
                    <div class="card" style="text-align: center;">
                        <h3>Studi Attivi nel Cloud</h3>
                        <p id="txt-studi-totali" style="font-size: 2.5em; color: #ffd700; font-weight: 300;">0</p>
                    </div>
                    <div class="card" style="text-align: center;">
                        <h3>Offerte Configurate</h3>
                        <p id="txt-offerte-totali" style="font-size: 2.5em; color: #ffd700; font-weight: 300;">0</p>
                    </div>
                </div>
                <div class="grid" style="margin-top: 20px;">
                    <div class="card">
                        <h3>➕ Configura Nuovo Studio</h3>
                        <input type="text" id="admStudioName" placeholder="Nome Studio">
                        <input type="text" id="admStudioRef" placeholder="Referente">
                        <select id="admStudioOffer"><option value="">Scegli Offerta</option></select>
                        <button onclick="adminAggiungiStudio()" style="width:100%;">Salva Studio</button>
                    </div>
                    <div class="card">
                        <h3>🏷️ Gestione Offerte</h3>
                        <input type="text" id="admOfferTitle" placeholder="Titolo Offerta">
                        <input type="text" id="admOfferPrice" placeholder="Prezzo (es. €50/mese)">
                        <button onclick="adminAggiungiOfferta()" style="width:100%;">🏷️ Aggiungi Offerta</button>
                    </div>
                </div>
            </div>

            <!-- TAB: GESTIONE CLIENTI -->
            <div id="moduloClienti" class="screen-module">
                <div class="card">
                    <h2>📇 Gestione Anagrafica Clienti</h2>
                    <div class="grid" style="margin-top:15px;">
                        <div>
                            <label>Nome *</label><input type="text" id="cNome" placeholder="Inserisci Nome">
                            <label>Cognome *</label><input type="text" id="cCognome" placeholder="Inserisci Cognome">
                        </div>
                        <div>
                            <label>Telefono</label><input type="text" id="cTel" placeholder="Inserisci Telefono">
                            <label>Email</label><input type="email" id="cEmail" placeholder="Inserisci Email">
                        </div>
                    </div>
                    <label>Indirizzo residenza</label><input type="text" id="cInd" placeholder="Via / Piazza, Città">
                    <label>Note aggiuntive cliente</label><textarea id="cNote" rows="2" placeholder="Informazioni particolari..."></textarea>
                    <button onclick="salvaNuovoCliente()" style="width:100%; margin-top:10px; background:#3498db; color:#fff;">Salva in Archivio</button>
                    <table id="tabellaClienti"><thead><tr><th>ID</th><th>Nominativo</th><th>Recapiti</th><th>Indirizzo</th></tr></thead><tbody></tbody></table>
                </div>
            </div>

            <!-- TAB: PREVENTIVI & CONTRATTI -->
            <div id="moduloPreventivi" class="screen-module">
                <div class="card" style="border: 1px solid #f1c40f;">
                    <h2>📝 Generatore Preventivi & Contratti</h2>
                    <div class="grid" style="margin-top: 15px;">
