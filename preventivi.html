<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Preventivi - AppCenter Studio Gold</title>
    <style>
        :root {
            --carta-zucchero: #7ea4b5;
            --verde-salvia: #9caf88;
            --rosa-antico: #dcaeaf;
            --scuro: #2b3a42;
            --chiaro: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--chiaro);
            color: var(--scuro);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 { color: var(--scuro); text-align: center; margin-bottom: 20px; }
        p { text-align: center; font-size: 14px; color: #666; }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: var(--verde-salvia);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-indietro { background-color: var(--rosa-antico); }
    </style>
</head>
<body>
<div class="container">
    <h2>📋 Generatore Preventivi PDF Hardware Local</h2>
    <p>Compila i campi per generare il preventivo istantaneo con l'interfaccia grafica coordinata al millimetro.</p>
    
    <input type="text" id="prev-cliente" placeholder="Nome Cliente / Sposi">
    <input type="number" id="prev-importo" placeholder="Importo Totale (€)">
    <button onclick="generaPreventivoLocale()">Genera & Scarica PDF</button>
    <button class="btn-indietro" onclick="location.href='index.html'">⬅ Torna alla Plancia</button>
</div>

<script>
function generaPreventivoLocale() {
    const cliente = document.getElementById("prev-cliente").value;
    const importo = document.getElementById("prev-importo").value;
    if(!cliente || !importo) { alert("Compila tutti i campi"); return; }
    
    alert(`Preventivo per ${cliente} di €${importo} generato localmente dal browser hardware.`);
    // Qui implementeremo la libreria PDF locale senza passare da server
}
</script>
</body>
</html>
