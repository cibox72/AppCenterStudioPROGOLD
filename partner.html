<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Consigliati - AppCenterStudioPROGOLD</title>
    <link rel="stylesheet" href="temi.css">
    <script src="temi.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #ffffff; min-height: 100vh; color: #000000; }
        .top-bar { background: linear-gradient(135deg, #d4af37, #996515); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .top-bar h1 { color: #ffffff; font-size: 1.4em; font-weight: 600; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: #ffffff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.9em; margin-left: 10px; }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .page-header { background: #ffffff; padding: 25px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #d4af37; }
        .page-header h2 { color: #000000; font-size: 1.6em; margin-bottom: 10px; }
        .page-header p { color: #666666; font-size: 0.95em; }
        .partner-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .partner-card { background: #ffffff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #d5d8dc; border-top: 4px solid #d4af37; display: flex; flex-direction: column; }
        .partner-logo-box { width: 100%; height: 140px; background: #ffffff; border: 1px solid #d5d8dc; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; overflow: hidden; padding: 10px; }
        .partner-logo-box img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
        .partner-card h3 { color: #000000; font-size: 1.2em; margin-bottom: 10px; font-weight: 700; }
        .partner-card .partner-desc { color: #666666; font-size: 0.95em; line-height: 1.5; margin-bottom: 10px; }
        .partner-card .partner-servizi { color: #000000; font-size: 0.9em; line-height: 1.5; margin-bottom: 15px; background: #fff9e6; padding: 10px; border-radius: 8px; border-left: 3px solid #d4af37; }
        .partner-card .partner-servizi strong { color: #996515; }
        .btn-vai-sito { display: block; width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.95em; color: #ffffff; background: linear-gradient(135deg, #d4af37, #996515); text-align: center; text-decoration: none; margin-top: auto; transition: all 0.3s ease; }
        .btn-vai-sito:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(212,175,55,0.4); }
        .empty-state { text-align: center; padding: 40px; color: #666666; background: #ffffff; border-radius: 15px; border: 1px solid #d5d8dc; }
        .loading { text-align: center; padding: 40px; color: #666666; }
        .spinner { border: 4px solid #fff9e6; border-top: 4px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer-branding { text-align: center; padding: 30px 20px; color: #666666; font-size: 0.9em; border-top: 1px solid #d5d8dc; margin-top: 40px; }
        .footer-branding strong { color: #996515; }
        @media (max-width: 768px) { .partner-grid { grid-template-columns: 1fr; } .top-bar { flex-wrap: wrap; gap: 10px; } }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Partner Consigliati</h1>
        <div>
            <button class="nav-btn" onclick="tornaPlancia()">← Torna alla Plancia</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h2>Aziende Partner e Fornitori Consigliati</h2>
            <p>Selezione di aziende di fiducia consigliate da AppCenterStudioPROGOLD per il tuo studio fotografico.</p>
        </div>

        <div id="loading-partner" class="loading">
            <div class="spinner"></div>
            <p>Caricamento partner consigliati...</p>
        </div>

        <div id="griglia-partner" class="partner-grid" style="display: none;"></div>

        <div id="empty-partner" class="empty-state" style="display: none;">
            <p>Nessun partner disponibile al momento.</p>
        </div>
    </div>

    <div class="footer-branding">
        <p>Piattaforma sviluppata e gestita da <strong>AppCenterStudioPROGOLD</strong></p>
    </div>

    <script>
        var token = '';
        var WORKER_URL = 'https://appcenter-backend.mairaluigi-b2f.workers.dev';

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            token = urlParams.get('token');
            if (!token) { alert('Token non trovato. Effettua il login.'); window.location.href = 'index.html'; return; }
            caricaPartner();
        });

        async function caricaPartner() {
            try {
                const response = await fetch(WORKER_URL + '/api/public/partner');
                const data = await response.json();
                document.getElementById('loading-partner').style.display = 'none';

                if (data.success && data.partner && data.partner.length > 0) {
                    const griglia = document.getElementById('griglia-partner');
                    griglia.style.display = 'grid';
                    document.getElementById('empty-partner').style.display = 'none';
                    griglia.innerHTML = '';

                    data.partner.forEach(function(p) {
                        const card = document.createElement('div');
                        card.className = 'partner-card';

                        let logoHtml = '';
                        if (p.logo_url) {
                            logoHtml = '<img src="' + p.logo_url + '" alt="Logo ' + (p.nome_azienda || 'Partner') + '">';
                        } else {
                            logoHtml = '<span style="color: #996515; font-weight: 700; font-size: 1.2em;">' + (p.nome_azienda || 'PARTNER') + '</span>';
                        }

                        let serviziHtml = '';
                        if (p.servizi) {
                            serviziHtml = '<div class="partner-servizi"><strong>Servizi:</strong> ' + p.servizi + '</div>';
                        }

                        card.innerHTML = '' +
                            '<div class="partner-logo-box">' + logoHtml + '</div>' +
                            '<h3>' + (p.nome_azienda || 'Partner') + '</h3>' +
                            '<div class="partner-desc">' + (p.descrizione || '') + '</div>' +
                            serviziHtml +
                            '<a class="btn-vai-sito" href="' + (p.link_sito || '#') + '" target="_blank" rel="noopener noreferrer">VAI AL SITO</a>';

                        griglia.appendChild(card);
                    });
                } else {
                    document.getElementById('empty-partner').style.display = 'block';
                }
            } catch (error) {
                console.error('Errore caricamento partner:', error);
                document.getElementById('loading-partner').style.display = 'none';
                document.getElementById('empty-partner').style.display = 'block';
            }
        }

        function tornaPlancia() {
            window.location.href = 'plancia-studio.html?token=' + encodeURIComponent(token);
        }
    </script>
</body>
</html>
