<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AppCenterStudioPROGOLD</title>
    <style>
        :root {
            --primary: #82e0aa;
            --primary-dark: #1e8449;
            --primary-light: #e8f8f5;
            --primary-gradient: linear-gradient(135deg, #a9dfbf 0%, #82e0aa 50%, #1e8449 100%);
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #e8f8f5 40%, #ebf5fb 100%);
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #e8e8e8;
            --danger: #e74c3c;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }
        .top-bar {
            background: var(--primary-gradient);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(30, 132, 73, 0.15);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-btn {
            background: rgba(255,255,255,0.95); border: none; padding: 10px 18px; border-radius: 10px;
            cursor: pointer; font-size: 14px; font-weight: 600; color: var(--primary-dark);
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 24px; }
        .page-header {
            text-align: center; padding: 32px; background: white; border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(30, 132, 73, 0.12); margin-bottom: 32px; position: relative; overflow: hidden;
        }
        .page-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--primary-gradient); }
        .page-header h1 {
            font-size: 32px; font-weight: 800; background: var(--primary-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;
        }
        .card-3d {
            background: white; border-radius: var(--radius); padding: 32px; margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(30, 132, 73, 0.12); position: relative; overflow: hidden;
        }
        .card-3d::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--primary-gradient); }
        .card-title {
            font-size: 20px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px;
            padding-bottom: 12px; border-bottom: 2px solid var(--primary-light); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .table-container { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border-color); background: white; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { background: var(--primary-light); color: var(--primary-dark); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:hover td { background: #fafafa; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-warning { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; }
        .btn-warning:hover { transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 2000; }
        .toast {
            background: white; border-radius: 10px; padding: 14px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            margin-bottom: 10px; border-left: 4px solid var(--primary); animation: slideIn 0.3s ease;
        }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }
        .loading { text-align: center; padding: 40px; color: var(--text-light); }
        .hidden { display: none !important; }
        
        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: white; padding: 32px; border-radius: var(--radius); width: 90%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal h3 { margin-bottom: 20px; color: var(--primary-dark); }
        .modal input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="nav-btn" onclick="logout()">Logout</button>
        <div style="color: white; font-weight: 600;">Admin Panel - Cloud</div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Archivio Credenziali Cloud</h1>
            <p>Gestione centralizzata di tutti gli accessi Studio e Cliente</p>
        </div>

        <div id="loadingArea" class="loading">Verifica sessione cloud...</div>

        <div id="mainContent" class="hidden">
            <!-- STUDI -->
            <div class="card-3d">
                <div class="card-title">Archivio Studi</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>ID Studio</th><th>Nome</th><th>Email</th><th>Password</th><th>Azioni</th></tr>
                        </thead>
                        <tbody id="studiTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- CLIENTI -->
            <div class="card-3d">
                <div class="card-title">Archivio Clienti</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr><th>ID Cliente</th><th>Nome</th><th>Email</th><th>Password</th><th>Azioni</th></tr>
                        </thead>
                        <tbody id="clientiTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Modifica Password -->
    <div id="modalPassword" class="modal-overlay hidden">
        <div class="modal">
            <h3>Modifica Password Cloud</h3>
            <p id="modalInfo" style="margin-bottom: 16px; font-size: 13px; color: var(--text-light);"></p>
            <input type="text" id="nuovaPassword" placeholder="Nuova password">
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="chiudiModal()">Annulla</button>
                <button class="btn btn-warning" onclick="salvaPassword()">Salva sul Cloud</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://appcenter-backend.mairaluigi-b2f.workers.dev";
        let token = new URLSearchParams(window.location.search).get('token');
        let datiArchivio = { studi: [], clienti: [] };
        let utenteModifica = null;

        document.addEventListener('DOMContentLoaded', async function() {
            if (!token) { window.location.href = 'index.html'; return; }

            // 1. Verifica sessione
            try {
                const res = await fetch(`${WORKER_URL}/api/auth/verifica?token=${token}`);
                const data = await res.json();
                if (!data.success || data.tipo !== 'admin') {
                    mostraToast('Sessione non valida o non admin', 'error');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                    return;
                }
                
                // 2. Carica archivio
                await caricaArchivio();
            } catch (e) {
                mostraToast('Errore connessione', 'error');
            }
        });

        async function caricaArchivio() {
            try {
                const res = await fetch(`${WORKER_URL}/api/admin/credenziali?token=${token}`);
                const data = await res.json();
                if (data.success) {
                    datiArchivio = data;
                    renderizzaTabelle();
                    document.getElementById('loadingArea').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                }
            } catch (e) {
                mostraToast('Errore caricamento archivio', 'error');
            }
        }

        function renderizzaTabelle() {
            const tbodyStudi = document.getElementById('studiTable');
            const tbodyClienti = document.getElementById('clientiTable');

            tbodyStudi.innerHTML = datiArchivio.studi.map(s => `
                <tr>
                    <td><strong>${s.id}</strong></td>
                    <td>${s.nome}</td>
                    <td>${s.email}</td>
                    <td style="font-family: monospace; background: #f4f6f7; padding: 4px 8px; border-radius: 4px;">${s.password}</td>
                    <td><button class="btn btn-warning" onclick="apriModal('studio', '${s.id}')">Modifica Password</button></td>
                </tr>
            `).join('');

            tbodyClienti.innerHTML = datiArchivio.clienti.map(c => `
                <tr>
                    <td><strong>${c.id}</strong></td>
                    <td>${c.nome_a} ${c.cognome_a}</td>
                    <td>${c.email}</td>
                    <td style="font-family: monospace; background: #f4f6f7; padding: 4px 8px; border-radius: 4px;">${c.password}</td>
                    <td><button class="btn btn-warning" onclick="apriModal('cliente', '${c.id}')">Modifica Password</button></td>
                </tr>
            `).join('');
        }

        function apriModal(tipo, id) {
            utenteModifica = { tipo, id };
            document.getElementById('modalInfo').textContent = `Stai modificando la password per ${tipo} ID: ${id}`;
            document.getElementById('nuovaPassword').value = '';
            document.getElementById('modalPassword').classList.remove('hidden');
        }

        function chiudiModal() {
            document.getElementById('modalPassword').classList.add('hidden');
            utenteModifica = null;
        }

        async function salvaPassword() {
            const nuovaPwd = document.getElementById('nuovaPassword').value.trim();
            if (!nuovaPwd) { mostraToast('Inserisci una password', 'error'); return; }

            try {
                const res = await fetch(`${WORKER_URL}/api/admin/aggiorna-password?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: utenteModifica.tipo, id: utenteModifica.id, nuova_password: nuovaPwd })
                });
                const data = await res.json();
                if (data.success) {
                    mostraToast('Password aggiornata sul Cloud!', 'success');
                    chiudiModal();
                    await caricaArchivio();
                } else {
                    mostraToast('Errore aggiornamento', 'error');
                }
            } catch (e) {
                mostraToast('Errore connessione', 'error');
            }
        }

        async function logout() {
            try {
                await fetch(`${WORKER_URL}/api/auth/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
            } catch(e) {}
            window.location.href = 'index.html';
        }

        function mostraToast(msg, tipo) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = `<div>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
