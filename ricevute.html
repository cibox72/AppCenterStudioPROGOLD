<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emissione Ricevuta - AppCenterStudioPROGOLD</title>
    <style>
        /* VARIABILI COLORE DINAMICHE (Inizializzate con il tema Default) */
        :root {
            --primary: #82e0aa; 
            --primary-dark: #1e8449; 
            --primary-light: #e8f8f5;
            --primary-gradient: linear-gradient(135deg, #a9dfbf 0%, #82e0aa 50%, #1e8449 100%);
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #e8f8f5 40%, #ebf5fb 100%);
            --text-main: #2c3e50; 
            --text-light: #7f8c8d; 
            --border-color: #e8e8e8;
            --success: #27ae60; 
            --danger: #e74c3c; 
            --radius: 16px;
        }

        /* --------------------------------------------------- */
        /* STILI PER L'INTERFACCIA A SCHERMO (Elegante & Professional) */
        /* --------------------------------------------------- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient); 
            color: var(--text-main); 
            line-height: 1.6; 
            min-height: 100vh;
        }
        .top-bar {
            background: var(--primary-gradient); 
            padding: 16px 24px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 20px rgba(30, 132, 73, 0.15); 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }
        .nav-btn {
            background: rgba(255,255,255,0.95); 
            border: none; 
            padding: 10px 18px; 
            border-radius: 10px;
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--primary-dark);
        }
        .sync-status { color: white; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .sync-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 30px 24px; }
        
        .page-header {
            text-align: center; padding: 32px; background: white; border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(30, 132, 73, 0.12); margin-bottom: 32px; position: relative; overflow: hidden;
        }
        .page-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--primary-gradient); }
        .page-header h1 {
            font-size: 32px; font-weight: 800; background: var(--primary-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px;
        }
        .page-header p { color: var(--text-light); font-size: 15px; }

        .card-3d {
            background: white; border-radius: var(--radius); padding: 32px;
            box-shadow: 0 10px 30px rgba(30, 132, 73, 0.12); position: relative; overflow: hidden;
        }
        .card-3d::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--primary-gradient); }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 24px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        
        label { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            padding: 12px 16px; border: 2px solid var(--border-color); border-radius: 10px;
            font-size: 15px; transition: all 0.3s ease; color: var(--text-main); background: #fdfbfb;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 8px rgba(130, 224, 170, 0.3); }
        
        .btn-submit {
            width: 100%; padding: 16px; background: var(--primary-gradient); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 6px 20px rgba(30, 132, 73, 0.2); transition: all 0.3s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(30, 132, 73, 0.3); }

        /* --------------------------------------------------- */
        /* STILI DI STAMPA - GRAFICA PROFESSIONALE (DOPPIA COPIA A4) */
        /* --------------------------------------------------- */
        #print-area { display: none; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                display: block; position: absolute; left: 0; top: 0; width: 210mm; height: 297mm;
                box-sizing: border-box; padding: 12mm 10mm; background: white;
            }
            body { background: white; }
            
            /* Contenitore Specchietto Ricevuta Elegante */
            .premium-receipt {
                width: 100%; height: 128mm; border: 1.5px solid var(--primary-dark);
                border-radius: 12px; padding: 20px; box-sizing: border-box;
                position: relative; background: white; display: flex; flex-direction: column; justify-content: space-between;
                box-shadow: inset 0 0 0 1px var(--primary-light);
            }

            /* Riga di Taglio Centrale */
            .cut-line {
                width: 100%; height: 12mm; display: flex; align-items: center; justify-content: center;
                border-top: 2px dashed var(--text-light); margin: 3mm 0; box-sizing: border-box;
                color: var(--text-light); font-size: 11px; font-weight: bold; letter-spacing: 1px;
            }

            /* Intestazione della Ricevuta */
            .receipt-header {
                display: flex; justify-content: space-between; align-items: flex-start;
                border-bottom: 2px solid var(--primary); padding-bottom: 12px;
            }
            .studio-brand h2 { font-size: 18px; font-weight: 800; color: var(--primary-dark); letter-spacing: 0.5px; }
            .studio-brand p { font-size: 11px; color: var(--text-light); margin-top: 2px; }
            
            .receipt-meta { text-align: right; }
            .receipt-meta h3 { font-size: 22px; font-weight: 900; color: var(--primary-dark); letter-spacing: 1px; }
            .badge-copia {
                display: inline-block; padding: 4px 10px; background: var(--primary-light);
                color: var(--primary-dark); border-radius: 6px; font-size: 10px; font-weight: 700;
                text-transform: uppercase; margin-top: 4px; border: 1px solid var(--primary);
            }

            /* Griglia Dati Ricevuta */
            .receipt-body { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }
            .receipt-row { display: flex; align-items: flex-end; width: 100%; }
            .receipt-cell-label { font-size: 12px; font-weight: 700; color: var(--text-main); text-transform: uppercase; width: 160px; }
            .receipt-cell-value { flex-grow: 1; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; font-size: 14px; font-weight: 500; color: #111; }
            
            /* Dettaglio Numerazione e Data */
            .receipt-subgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }

            /* Blocco Importo in Cifre Evidenziato */
            .premium-amount-box {
                background: var(--primary-light); border: 2px dashed var(--primary-dark);
                border-radius: 8px; padding: 6px 16px; font-size: 16px; font-weight: 800;
                color: var(--primary-dark); display: flex; align-items: center; justify-content: center; min-width: 160px;
            }

            /* Piè di pagina Ricevuta e Firme */
            .receipt-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; }
            .signature-space { width: 220px; text-align: center; }
            .signature-line { border-top: 1px dashed var(--text-light); margin-bottom: 4px; height: 35px; }
            .signature-space p { font-size: 10px; font-weight: 600; color: var(--text-light); text-transform: uppercase; }
            
            .watermark {
                position: absolute; font-size: 70px; font-weight: 900; color: rgba(130, 224, 170, 0.05);
                top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); text-transform: uppercase; pointer-events: none;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="nav-btn" onclick="location.href='plancia-studio.html'">Plancia</button>
        <div class="sync-status"><span class="sync-dot"></span> Cloud Sync Attivo</div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Emissione Ricevuta Cassa</h1>
            <p>Compila il modulo sottostante. Il documento verrà salvato nel database Cloud e formattato in doppia copia A4.</p>
        </div>

        <div class="card-3d">
            <form id="receiptForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="numero">Ricevuta Numero</label>
                        <input type="number" id="numero" required placeholder="Es. 102">
                    </div>
                    <div class="form-group">
                        <label for="data">Data Emissione</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group full-width">
